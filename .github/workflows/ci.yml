name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build API
        run: go build ./cmd/api

      - name: Build Worker
        run: go build ./cmd/worker

      - name: Run Tests
        run: go test ./internal/... -v -race -count=1

      - name: Run Vet
        run: go vet ./...
