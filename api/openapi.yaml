openapi: 3.1.0
info:
  title: TrueConnect API
  version: 1.0.0
  description: Trust-based social networking and dating platform API
  contact:
    name: TrueConnect Team

servers:
  - url: http://localhost:8080/v1
    description: Local development
  - url: https://api.trueconnect.kz/v1
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication endpoints
  - name: User
    description: User account management
  - name: Profile
    description: User profile management
  - name: Matching
    description: Matching and discovery
  - name: Settings
    description: User preferences
  - name: Interaction
    description: Interactions and trust scoring
  - name: Post
    description: Social feed
  - name: Chat
    description: Real-time messaging
  - name: KYC
    description: Identity verification
  - name: Report
    description: User reports
  - name: Health
    description: Service health
  - name: Halal
    description: Halal-specific features (mahram, imams, venues, niyyah)
  - name: Whisper
    description: Anonymous peer feedback
  - name: Notification
    description: In-app notifications
  - name: Admin
    description: Admin-only moderation endpoints

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      postgres:
                        type: string
                        example: ok
                      neo4j:
                        type: string
                        example: ok
                      redis:
                        type: string
                        example: ok

  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      description: Requires refresh_token cookie
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: logged out

  /users/me:
    get:
      tags: [User]
      summary: Get current user
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [User]
      summary: Delete account
      description: Soft deletes the user account and revokes all sessions
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profiles/{id}:
    get:
      tags: [Profile]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/me:
    put:
      tags: [Profile]
      summary: Create or update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpsert'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/me/photos:
    get:
      tags: [Profile]
      summary: List profile photos
      responses:
        '200':
          description: List of photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
    post:
      tags: [Profile]
      summary: Upload profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Photo'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/me/photos/{photoID}:
    delete:
      tags: [Profile]
      summary: Delete profile photo
      parameters:
        - name: photoID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Photo deleted
        '404':
          description: Photo not found

  /matching/candidates:
    get:
      tags: [Matching]
      summary: Get matching candidates
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchCandidate'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /matching/like:
    post:
      tags: [Matching]
      summary: Like a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Like recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      matched:
                        type: boolean
                      match_id:
                        type: string
                        format: uuid

  /matching/pass:
    post:
      tags: [Matching]
      summary: Pass on a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Pass recorded

  /matches:
    get:
      tags: [Matching]
      summary: List mutual matches
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'

  /settings:
    get:
      tags: [Settings]
      summary: Get user settings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Settings'
    patch:
      tags: [Settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Settings'

  /interactions:
    post:
      tags: [Interaction]
      summary: Submit rating after meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCreate'
      responses:
        '201':
          description: Interaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Interaction'

  /interactions/{id}/confirm:
    post:
      tags: [Interaction]
      summary: Confirm an interaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interaction confirmed

  /users/{id}/reputation:
    get:
      tags: [Interaction]
      summary: Get user's trust score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User reputation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reputation'

  /posts:
    get:
      tags: [Post]
      summary: List feed posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
    post:
      tags: [Post]
      summary: Create post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'

  /posts/{id}:
    get:
      tags: [Post]
      summary: Get single post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
    delete:
      tags: [Post]
      summary: Delete post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post deleted

  /posts/{id}/like:
    post:
      tags: [Post]
      summary: Like post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post liked
    delete:
      tags: [Post]
      summary: Unlike post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post unliked

  /posts/{id}/comments:
    get:
      tags: [Post]
      summary: List comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
    post:
      tags: [Post]
      summary: Add comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Comment'

  /matches/{id}/messages:
    get:
      tags: [Chat]
      summary: Get message history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'

  /ws:
    get:
      tags: [Chat]
      summary: WebSocket endpoint
      description: |
        WebSocket connection for real-time messaging.
        First message must be `{"type":"auth","token":"<jwt>"}`
      responses:
        '101':
          description: Switching Protocols

  /kyc/submit:
    post:
      tags: [KYC]
      summary: Submit KYC document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                  description: JPEG, PNG, or PDF (max 10MB)
      responses:
        '202':
          description: Document accepted for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: pending
                      message:
                        type: string

  /kyc/status:
    get:
      tags: [KYC]
      summary: Get verification status
      responses:
        '200':
          description: KYC status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verification_level:
                        type: string
                        enum: [none, basic, verified]
                      is_verified:
                        type: boolean

  /reports:
    post:
      tags: [Report]
      summary: Report a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: pending
        '400':
          description: Self-report not allowed
        '409':
          description: Already reported this user

  /matching/graph-candidates:
    get:
      tags: [Matching]
      summary: Get graph-based trust candidates
      description: Returns candidates ranked by the Neo4j trust graph (PageRank-weighted).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of graph candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchCandidate'

  /matching/likes:
    get:
      tags: [Matching]
      summary: Get pending likes
      description: Returns profiles of users who liked the caller but haven't been liked back.
      responses:
        '200':
          description: List of pending likers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchCandidate'

  /matches/{id}/unmatch:
    post:
      tags: [Matching]
      summary: Unmatch from a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unmatched successfully
        '403':
          description: Not a participant in this match

  /matches/{id}/family-intro:
    post:
      tags: [Halal]
      summary: Mark family introduction as done
      description: Signals that families have been introduced; unlocks imam connect flow.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Family intro milestone recorded
        '403':
          description: Not a participant in this match

  /matches/{id}/nikah-confirm:
    post:
      tags: [Halal]
      summary: Confirm nikah via an imam
      description: Marks the match as imam-confirmed and updates marital status.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imam_id]
              properties:
                imam_id:
                  type: string
                  description: ID from the embedded imam catalog
      responses:
        '200':
          description: Nikah confirmed
        '403':
          description: Not a participant in this match
        '409':
          description: Family intro not completed yet

  /users/{id}/block:
    post:
      tags: [User]
      summary: Block a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User blocked
        '400':
          description: Cannot block yourself

  /users/me/fcm-token:
    put:
      tags: [User]
      summary: Register FCM push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token registered

  /mahram:
    get:
      tags: [Halal]
      summary: List my mahrams
      responses:
        '200':
          description: Mahram list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mahram'
    post:
      tags: [Halal]
      summary: Register a mahram by phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^\+7[0-9]{10}$'
      responses:
        '201':
          description: Mahram registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Mahram'

  /mahram-rooms:
    post:
      tags: [Halal]
      summary: Create a mahram chat room for a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id, mahram_user_id]
              properties:
                match_id:
                  type: string
                  format: uuid
                mahram_user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Mahram room created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MahramRoom'
        '400':
          description: Mahram must be a third party
        '403':
          description: Match not finalized

  /mahram-rooms/{id}/messages:
    get:
      tags: [Halal]
      summary: Get mahram chat history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Mahram messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MahramMessage'
    post:
      tags: [Halal]
      summary: Send a mahram chat message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MahramMessage'

  /whisper:
    post:
      tags: [Whisper]
      summary: Submit anonymous whisper feedback about a matched user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhisperCreate'
      responses:
        '201':
          description: Whisper submitted anonymously
        '403':
          description: Users must have been matched

  /imams:
    get:
      tags: [Halal]
      summary: List imams
      description: Returns the embedded imam catalog, optionally filtered by city.
      parameters:
        - name: city
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Imam list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Imam'

  /venues:
    get:
      tags: [Halal]
      summary: List halal venues for first meetings
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Venue list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Venue'

  /reputation/leaderboard:
    get:
      tags: [Interaction]
      summary: Top-trusted users leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'

  /reputation/me/breakdown:
    get:
      tags: [Interaction]
      summary: Breakdown of the authenticated user's own trust score
      description: >-
        Self-only. Returns every component the trust engine used to derive the
        score (KYC bonus, Bayesian-smoothed rating average, report penalty)
        plus the recent ratings that contributed. Exposes moderation signals,
        so it never reports on another user.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Trust score breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      breakdown:
                        $ref: '#/components/schemas/TrustScoreBreakdown'
                      ratings:
                        type: array
                        items:
                          type: object
        '401':
          description: Authentication required

  /notifications:
    get:
      tags: [Notification]
      summary: List notifications for the current user
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/{id}/read:
    post:
      tags: [Notification]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as read

  /notifications/read-all:
    post:
      tags: [Notification]
      summary: Mark all notifications as read
      responses:
        '200':
          description: All marked as read

  /admin/users:
    get:
      tags: [Admin]
      summary: Search and list users (admin)
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserView'

  /admin/kyc/pending:
    get:
      tags: [Admin]
      summary: List KYC submissions awaiting review
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Pending KYC list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminKYCRow'

  /admin/kyc/{userId}/verdict:
    post:
      tags: [Admin]
      summary: Approve or reject a KYC submission
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [approved, rejected]
                reason:
                  type: string
      responses:
        '200':
          description: Verdict recorded

  /admin/sybil/pending:
    get:
      tags: [Admin]
      summary: List suspected Sybil clusters awaiting review
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Sybil cluster list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SybilCluster'

  /admin/whisper-flags:
    get:
      tags: [Admin]
      summary: List admin-flagged whisper reports
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Flagged whisper reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WhisperFlag'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    RegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^\+7[0-9]{10}$'
          example: '+77001234567'
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^\+7[0-9]{10}$'
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
            expires_in:
              type: integer
              description: Token lifetime in seconds
            user_id:
              type: string
              format: uuid

    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        verification_level:
          type: string
          enum: [none, basic, verified]
        trust_score:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        bio:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        looking_for:
          type: string
          enum: [male, female, any]
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        last_active:
          type: string
          format: date-time

    ProfileUpsert:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 500
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        looking_for:
          type: string
          enum: [male, female, any]
        latitude:
          type: number
        longitude:
          type: number

    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        position:
          type: integer
        created_at:
          type: string
          format: date-time

    MatchCandidate:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        bio:
          type: string
        age:
          type: integer
        distance_km:
          type: number
        trust_score:
          type: integer
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'

    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/MatchCandidate'
        matched_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time

    Settings:
      type: object
      properties:
        push_notifications:
          type: boolean
        show_online_status:
          type: boolean
        distance_unit:
          type: string
          enum: [km, mi]
        max_distance_km:
          type: integer
        age_range_min:
          type: integer
        age_range_max:
          type: integer

    SettingsPatch:
      type: object
      properties:
        push_notifications:
          type: boolean
        show_online_status:
          type: boolean
        distance_unit:
          type: string
          enum: [km, mi]
        max_distance_km:
          type: integer
          minimum: 1
          maximum: 500
        age_range_min:
          type: integer
          minimum: 18
        age_range_max:
          type: integer
          maximum: 100

    InteractionCreate:
      type: object
      required: [target_id, rating, met_in_person]
      properties:
        target_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
        met_in_person:
          type: boolean

    Interaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        initiator_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
        rating:
          type: integer
        comment:
          type: string
        met_in_person:
          type: boolean
        confirmed:
          type: boolean
        created_at:
          type: string
          format: date-time

    Reputation:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        trust_score:
          type: integer
          minimum: 0
          maximum: 100
        verification_level:
          type: string
          enum: [none, basic, verified]
        total_interactions:
          type: integer
        average_rating:
          type: number

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
        content:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        liked_by_me:
          type: boolean
        created_at:
          type: string
          format: date-time

    PostCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1000

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time

    ReportCreate:
      type: object
      required: [reported_id, reason]
      properties:
        reported_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 50
          enum: [spam, harassment, fake_profile, inappropriate_content, other]
        description:
          type: string
          maxLength: 500

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Mahram:
      type: object
      properties:
        id:
          type: string
          format: uuid
        verification_status:
          type: string
          enum: [pending, verified, rejected]
        created_at:
          type: string
          format: date-time

    MahramRoom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        mahram_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    MahramMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time

    WhisperCreate:
      type: object
      required: [reported_id, feedback]
      properties:
        reported_id:
          type: string
          format: uuid
        meeting_match_id:
          type: string
          format: uuid
        feedback:
          type: string
          maxLength: 1000
        strike_weight:
          type: integer
          minimum: 1
          maximum: 3
          default: 1

    WhisperFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reported_id:
          type: string
          format: uuid
        strike_weight:
          type: integer
        admin_flagged:
          type: boolean
        created_at:
          type: string
          format: date-time

    Imam:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        mosque:
          type: string
        phone:
          type: string

    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        category:
          type: string
          description: cafe | park | restaurant | cultural_center

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        trust_score:
          type: integer
        verification_level:
          type: string
          enum: [none, basic, verified]

    TrustScoreBreakdown:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        score:
          type: integer
          description: Final clamped trust score (0-100)
        badge:
          type: string
        rating_count:
          type: integer
          description: Number of verified ratings received
        smoothed_rating:
          type: number
          format: double
          description: Bayesian-smoothed average rating (0-5)
        base_score:
          type: number
          format: double
          description: smoothed_rating * 20
        kyc_bonus:
          type: number
          format: double
        report_count:
          type: integer
        report_penalty:
          type: number
          format: double
        raw_score:
          type: number
          format: double
          description: Score before clamping to 0-100

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [match, like, niyyah_expired, new_message]
        actor_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    AdminKYCRow:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        phone:
          type: string
        verification_level:
          type: string
          enum: [none, basic, verified]
        document_url:
          type: string
          format: uri
        submitted_at:
          type: string
          format: date-time

    SybilCluster:
      type: object
      properties:
        cluster_id:
          type: string
        user_ids:
          type: array
          items:
            type: string
            format: uuid
        external_edge_ratio:
          type: number
          description: Fraction of edges going outside this cluster (low = suspicious)
        kyc_rate:
          type: number
          description: Fraction of users in the cluster who are KYC-verified
